<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%23059669'/><path d='M30 35 v30 M70 35 v30 M20 40 v20 M80 40 v20 M30 50 h40' stroke='white' stroke-width='8' stroke-linecap='round'/></svg>">
    <title>EduFís Pro v8.9 - Plataforma de Gestão Pedagógica</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        @media print {
            header, aside, button, .no-print, #view-login { 
                display: none !important; 
            }
            body, main { 
                background: white !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                box-shadow: none !important;
                width: 100% !important;
            }
            #tab-gestao { 
                display: block !important; 
                width: 100% !important; 
                max-width: 100% !important; 
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
            }
            textarea, input {
                border: 1px solid #cbd5e1 !important;
                background: white !important;
                resize: none !important;
                color: black !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col antialiased">

    <script>
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbyTUXPXMwt_qEjteIef1pfSDs1kgzc_ck3QJkLpGzHygB8nOq03zANVHAfvDC1vKfrvKA/exec";

        let usuarios = JSON.parse(localStorage.getItem('edufis_usuarios_v8')) || [];
        let usuarioLogado = JSON.parse(localStorage.getItem('edufis_sessao_v8')) || null;

        let turmas = JSON.parse(localStorage.getItem('edufis_turmas_v8')) || [];
        let alunos = JSON.parse(localStorage.getItem('edufis_alunos_v8')) || [];
        let documentosWord = JSON.parse(localStorage.getItem('edufis_word_v8')) || [];
        let documentosPDF = JSON.parse(localStorage.getItem('edufis_pdf_v8')) || [];
        let planoGestaoDados = JSON.parse(localStorage.getItem('edufis_plano_v8')) || {};
        let agendaHojeDados = JSON.parse(localStorage.getItem('edufis_agenda_v8')) || { turma: '', conteudo: '' };
        let configApp = JSON.parse(localStorage.getItem('edufis_config_v8')) || {
            temaCor: 'emerald',
            nomeProf: '',
            nomeEscola: ''
        };

        // Ilustrações anatômicas limpas em SVG
        const baseAnatomia = [
            { 
                id: "m1", 
                nome: "Posição Anatômica", 
                tipo: "Referência", 
                regiao: "Geral", 
                acao: "Posição padrão de referência com corpo ereto, palmas voltadas para frente.", 
                exercicios: "Postura e alinhamento corporal inicial.", 
                svgIcon: `<svg class="w-24 h-24 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>` 
            },
            { 
                id: "m2", 
                nome: "Planos Anatômicos", 
                tipo: "Referência", 
                regiao: "Geral", 
                acao: "Planos Sagital, Frontal (Coronal) e Transversal para orientação dos movimentos.", 
                exercicios: "Análise biomecânica de gestos desportivos.", 
                svgIcon: `<svg class="w-24 h-24 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6h12M6 12h12M6 18h12M12 3v18" /></svg>` 
            },
            { 
                id: "m3", 
                nome: "Articulação do Joelho", 
                tipo: "Articulação", 
                regiao: "Inferiores", 
                acao: "Articulação sinovial (dobradiça) que permite flexão e extensão.", 
                exercicios: "Agachamento, saltos, corrida.", 
                svgIcon: `<svg class="w-24 h-24 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m0 0l-3-3m3 3l3-3M9 9h6" /></svg>` 
            },
            { 
                id: "m4", 
                nome: "Membros Superiores (Ossos)", 
                tipo: "Esqueleto", 
                regiao: "Esqueleto", 
                acao: "Clavícula, escápula, úmero, rádio, ulna e ossos da mão.", 
                exercicios: "Arremessos, pegada, sustentação de carga.", 
                svgIcon: `<svg class="w-24 h-24 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2a4 4 0 00-4 4v12a4 4 0 008 0V6a4 4 0 00-4-4z" /></svg>` 
            },
            { 
                id: "m5", 
                nome: "Musculatura Corporal Global", 
                tipo: "Músculo", 
                regiao: "Geral", 
                acao: "Visão geral do sistema muscular estriado esquelético.", 
                exercicios: "Postura global e geração de movimento corporal.", 
                svgIcon: `<svg class="w-24 h-24 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>` 
            },
            { 
                id: "m6", 
                nome: "Peitoral Maior", 
                tipo: "Músculo", 
                regiao: "Tronco", 
                acao: "Adução e rotação medial do braço; flexão do ombro.", 
                exercicios: "Supino, flexões de braço, arremessos.", 
                svgIcon: `<svg class="w-24 h-24 text-rose-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" /></svg>` 
            },
            { 
                id: "m7", 
                nome: "Reto Abdominal", 
                tipo: "Músculo", 
                regiao: "Tronco", 
                acao: "Flexão do tronco e estabilização do core.", 
                exercicios: "Prancha abdominal, flexão de tronco.", 
                svgIcon: `<svg class="w-24 h-24 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6h16.5M3.75 12h16.5m-16.5 6h16.5" /></svg>` 
            },
            { 
                id: "m8", 
                nome: "Bíceps Braquial", 
                tipo: "Músculo", 
                regiao: "Superiores", 
                acao: "Flexão do cotovelo e supinação do antebraço.", 
                exercicios: "Rosca direta, puxadas e barras.", 
                svgIcon: `<svg class="w-24 h-24 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>` 
            }
        ];

        function salvarDadosLocais() {
            localStorage.setItem('edufis_usuarios_v8', JSON.stringify(usuarios));
            localStorage.setItem('edufis_sessao_v8', JSON.stringify(usuarioLogado));
            localStorage.setItem('edufis_turmas_v8', JSON.stringify(turmas));
            localStorage.setItem('edufis_alunos_v8', JSON.stringify(alunos));
            localStorage.setItem('edufis_word_v8', JSON.stringify(documentosWord));
            localStorage.setItem('edufis_pdf_v8', JSON.stringify(documentosPDF));
            localStorage.setItem('edufis_plano_v8', JSON.stringify(planoGestaoDados));
            localStorage.setItem('edufis_agenda_v8', JSON.stringify(agendaHojeDados));
            localStorage.setItem('edufis_config_v8', JSON.stringify(configApp));
        }

        function aplicarTemaCor(cor) {
            configApp.temaCor = cor;
            salvarDadosLocais();

            const mapaCores = {
                emerald: { main: 'bg-emerald-600', hover: 'hover:bg-emerald-700', text: 'text-emerald-600' },
                sky: { main: 'bg-sky-600', hover: 'hover:bg-sky-700', text: 'text-sky-600' },
                purple: { main: 'bg-purple-600', hover: 'hover:bg-purple-700', text: 'text-purple-600' },
                slate: { main: 'bg-slate-800', hover: 'hover:bg-slate-900', text: 'text-slate-800' }
            };

            const c = mapaCores[cor] || mapaCores.emerald;

            document.querySelectorAll('.btn-primary-theme').forEach(el => {
                el.className = el.className.replace(/bg-\w+-\d+/g, c.main).replace(/hover:bg-\w+-\d+/g, c.hover);
            });
            document.querySelectorAll('.text-theme-main').forEach(el => {
                el.className = el.className.replace(/text-\w+-\d+/g, c.text);
            });
            document.querySelectorAll('.brand-icon-bg').forEach(el => {
                el.className = el.className.replace(/bg-\w+-\d+/g, c.main);
            });
        }
    </script>

    <!-- TELA DE LOGIN & REGISTRO -->
    <div id="view-login" class="flex flex-col items-center justify-center flex-1 p-4 bg-slate-100">
        <div class="w-full max-w-md bg-white border border-slate-200 rounded-3xl p-8 shadow-xl space-y-6">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 brand-icon-bg bg-emerald-600 rounded-2xl flex items-center justify-center mx-auto shadow-md p-3.5">
                    <svg class="w-full h-full text-white" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round">
                        <path d="M30 35 v30 M70 35 v30 M20 40 v20 M80 40 v20 M30 50 h40"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">EduFís Pro</h1>
                <p class="text-slate-500 text-xs font-medium">Aceda à sua conta de Gestão Pedagógica</p>
            </div>
            
            <form id="form-login" class="space-y-4" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">E-mail Profissional</label>
                    <input type="email" id="login-email" required placeholder="professor@escola.pt" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Palavra-passe</label>
                    <input type="password" id="login-senha" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" class="w-full btn-primary-theme bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg transition-all cursor-pointer">Entrar na Plataforma</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="view-dashboard" class="hidden flex flex-col flex-1 min-h-screen">
        <header class="bg-white border-b border-slate-200 px-8 py-3.5 flex items-center justify-between sticky top-0 z-40">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 brand-icon-bg bg-emerald-600 rounded-xl flex items-center justify-center p-2">
                    <svg class="w-full h-full text-white" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8"><path d="M30 35 v30 M70 35 v30 M20 40 v20 M80 40 v20 M30 50 h40"/></svg>
                </div>
                <span class="text-base font-extrabold text-slate-900 block">EduFís Pro</span>
            </div>
            <button onclick="logout()" class="text-xs bg-rose-50 text-rose-600 border border-rose-200 px-3.5 py-2 rounded-xl font-bold">Sair</button>
        </header>

        <div class="flex flex-1">
            <aside class="w-72 bg-white border-r border-slate-200 p-4 space-y-1">
                <button onclick="changeTab('anatomia')" class="w-full text-left px-3.5 py-2.5 rounded-xl text-sm font-bold text-emerald-700 bg-emerald-50 flex items-center gap-3">🦴 Atlas Anatómico por Ilustrações</button>
            </aside>

            <main class="flex-1 p-8 max-w-6xl mx-auto w-full">
                <div id="tab-anatomia" class="space-y-6">
                    <div>
                        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Atlas Anatómico Ilustrado 🦴</h2>
                        <p class="text-slate-500 text-sm">Ilustrações anatômicas diretas para consulta pedagógica.</p>
                    </div>

                    <div id="grid-anatomia" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        function renderizarAtlasAnatomia() {
            const container = document.getElementById('grid-anatomia');
            if (!container) return;

            container.innerHTML = baseAnatomia.map(item => `
                <div class="bg-white border border-slate-200/80 rounded-3xl overflow-hidden shadow-xs flex flex-col justify-between">
                    <div>
                        <div class="h-48 w-full bg-slate-900/5 flex items-center justify-center border-b border-slate-100 p-6">
                            ${item.svgIcon}
                        </div>
                        <div class="p-6 space-y-3">
                            <div class="flex justify-between items-center">
                                <h3 class="font-extrabold text-lg text-slate-900">${item.nome}</h3>
                                <span class="px-3 py-1 rounded-full text-[10px] font-extrabold bg-slate-800 text-white">${item.tipo}</span>
                            </div>
                            <div class="space-y-2 text-xs text-slate-600">
                                <div><strong class="text-slate-800 font-bold uppercase text-[10px] block">Ação / Descrição:</strong> ${item.acao}</div>
                                <div><strong class="text-emerald-700 font-bold uppercase text-[10px] block">Aplicações na Ed. Física:</strong> ${item.exercicios}</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleLogin(e) {
            e.preventDefault();
            usuarioLogado = { nome: "Professor" };
            salvarDadosLocais();
            switchView('dashboard');
        }

        function logout() {
            usuarioLogado = null;
            salvarDadosLocais();
            switchView('login');
        }

        function switchView(view) {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-dashboard').classList.add('hidden');

            if (view === 'login') document.getElementById('view-login').classList.remove('hidden');
            if (view === 'dashboard') {
                document.getElementById('view-dashboard').classList.remove('hidden');
                renderizarAtlasAnatomia();
            }
        }

        if (usuarioLogado) switchView('dashboard');
        else switchView('login');
    </script>
</body>
</html>
